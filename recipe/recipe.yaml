schema_version: 1

context:
  version: "5.1.1"
  name: ${{ "qt5-advanced-docking-system" if qt == "5" else "qt6-advanced-docking-system" }}
  libname: ${{ "qtadvanceddocking-qt5" if qt == "5" else "qtadvanceddocking-qt6" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System/archive/v${{ version }}.tar.gz
  sha256: 9ce947acbb1984946f9145c976e42e6984f99b98fb414dd7354a290af6d4ff04
  patches:
    # Keep inactive tabs parented to their dock area, so render-to-texture
    # widgets (QRhiWidget, QOpenGLWidget) keep their graphics resources across
    # tab switches. Needed by PlotJuggler 4. From the PlotJuggler fork:
    # https://github.com/PlotJuggler/Qt-Advanced-Docking-System/commit/d713b1f97ecec009fa07b83f6594adec2f131d41
    - 0001-keep-inactive-tabs-parented-to-their-dock-area.patch

build:
  number: 3
  dynamic_linking:
    missing_dso_allowlist:
      # Follow: https://github.com/conda-forge/deno-feedstock/blob/49611827965b148b4e724b23d4077de17cf4f90b/recipe/meta.yaml#L13-L23
      - if: osx
        then: /System/Library/Frameworks/Metal.framework/Versions/A/Metal

requirements:
  build:
    - cmake
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - if: win
      then: ninja
      else: make
  host:
    - if: qt == "5"
      then: qt-main
      else: qt6-main
    - if: linux
      then:
        - libxcb
        - libgl-devel
  run_exports:
    - ${{ pin_subpackage(name, upper_bound="x.x") }}

tests:
  - package_contents:
      lib:
        - ${{ libname }}
      include:
        - ${{ libname }}/ads_globals.h
      files:
        - ${{ "Library/" if win }}lib/cmake/${{ libname }}/${{ libname }}Config.cmake

about:
  homepage: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System
  license: LGPL-2.1-only
  license_file: gnu-lgpl-v2.1.md
  summary: Advanced Docking System for Qt

extra:
  feedstock-name: qt6-advanced-docking-system
  recipe-maintainers:
    - n-elie
